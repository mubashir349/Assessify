<body data-page="monitor" data-title="Live Monitor" data-sub="Undergraduate Admission Test — Fall 2026 · window closes in 41:12">

</template>

<template id="a-content-template">

  <div class="status-strip">
    <div class="status-pill active"><div class="n">1,284</div><div class="l">All candidates</div></div>
    <div class="status-pill"><div class="n" style="color:#94a3b8;">62</div><div class="l">Not Started</div></div>

        </tr>
        <tr>
          <td class="name">Sana Fatima</td><td class="mono">PM-2026-091</td><td>Pre-Medical</td>
          <td><span class="badge badge-in-progress">● In Progress</span></td><td class="mono">1:02:40</td>
          <td><button class="a-btn a-btn-ghost a-btn-sm" disabled>—</button> <button class="a-btn a-btn-danger a-btn-sm">End</button></td>

        <tr>

          <td><button class="a-btn a-btn-ghost a-btn-sm" disabled>Waiting…</button> <button class="a-btn a-btn-danger a-btn-sm">End</button></td>
        </tr>
        <tr>
          <td class="name">Mehak Iqbal</td><td class="mono">PE-2026-201</td><td>Pre-Engineering</td>
