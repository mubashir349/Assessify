<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Monitor — Institution Admin</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0B1020">
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/icons.js"></script>
<link rel="stylesheet" href="../../assets/css/theme.css" />
<link rel="stylesheet" href="../../assets/css/admin-shell.css" />
<link rel="stylesheet" href="../../assets/css/monitor.css" />
</head>
<body data-page="monitor" data-title="Live Monitor" data-sub="Pick a test to watch its candidates">

<template id="a-actions-template">
  <span class="live-note"><span class="live-dot" id="liveDot"></span><span id="liveText">Connecting…</span></span>
</template>

<template id="a-content-template">

  <div class="a-empty" id="noTests" hidden>
    <div class="ic"><i data-icon="monitor"></i></div><h4>No published tests yet</h4>
    <p>Publish a test and add its roster; its candidates appear here while they take it.</p>
    <p style="margin-top:12px;"><a href="create-test.html" class="a-btn a-btn-primary a-btn-sm">Create a test</a></p>
  </div>

  <div id="monitorArea" hidden>
    <div class="filters">
      <select class="a-select" id="testSel" aria-label="Test to monitor"></select>
      <select class="a-select" id="deptSel" aria-label="Filter by field / department"><option value="">All fields / departments</option></select>
      <input class="a-input" id="searchBox" aria-label="Search candidates" placeholder="Search name, roll no. or email…" />
    </div>

    <div class="status-strip" id="statusStrip"></div>

    <div class="a-table-wrap">
      <table class="a-table">
        <thead><tr><th>Candidate</th><th>Roll No.</th><th id="termHead">Field / Department</th><th>Status</th><th>Answered</th><th>Remaining</th><th>Last seen</th><th></th></tr></thead>
        <tbody id="monBody"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
    <p class="muted" style="margin-top:12px;font-size:11.5px;">Status list only — no screen-mirroring or video of any candidate's device. A candidate shows as
      <b>Disconnected</b> when their test page has not reached the server for <span id="offlineSecs">75</span> seconds.</p>
  </div>

</template>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/admin-shell.js"></script>
<script src="../../assets/js/monitor.js"></script>
</body>
</html>
