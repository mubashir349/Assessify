<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Institution Admin</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0B1020">
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/icons.js"></script>
<link rel="stylesheet" href="../../assets/css/theme.css" />
<link rel="stylesheet" href="../../assets/css/admin-shell.css" />
<link rel="stylesheet" href="../../assets/css/dashboard.css" />
</head>
<body data-page="dashboard" data-title="Dashboard" data-sub-from="institution">

<template id="a-actions-template">
  <a href="create-test.html" class="a-btn a-btn-primary"><i data-icon="plus"></i> New Aptitude Test</a>
</template>

<template id="a-content-template">

  <div class="a-grid a-grid-4" style="margin-bottom:22px;">
    <div class="a-card a-stat">
      <span class="kpi-ico i-coral"><i data-icon="zap"></i></span>
      <div class="lbl">Tests live now</div>
      <div class="num" id="sLive">–</div>
      <div class="delta"><span id="sLiveSub">&nbsp;</span></div>
    </div>
    <div class="a-card a-stat">
      <span class="kpi-ico i-indigo"><i data-icon="roster"></i></span>
      <div class="lbl">Candidates on rosters</div>
      <div class="num" id="sCands">–</div>
      <div class="delta"><span id="sCandsSub">&nbsp;</span></div>
    </div>
    <div class="a-card a-stat">
      <span class="kpi-ico i-emerald"><i data-icon="trending"></i></span>
      <div class="lbl">Average score</div>
      <div class="num" id="sAvg">–</div>
      <div class="delta"><span id="sAvgSub">&nbsp;</span></div>
    </div>
    <div class="a-card a-stat">
      <span class="kpi-ico i-cyan"><i data-icon="bank"></i></span>
      <div class="lbl">Approved questions</div>
      <div class="num" id="sQs">–</div>
      <div class="delta"><span id="sQsSub">&nbsp;</span></div>
    </div>
  </div>

  <div class="a-grid a-grid-2 dash-viz" style="margin-bottom:22px;">
    <div class="a-card">
      <div class="section-head"><div><h2>Candidate progress</h2><p id="candVizSub">All candidates on your rosters</p></div></div>
      <div class="stack-bar" id="candBar" role="img" aria-label="Candidate status breakdown"></div>
      <div class="viz-legend" id="candLegend"></div>
    </div>
    <div class="a-card">
      <div class="section-head"><div><h2>Tests by state</h2><p>Counted from your test list</p></div></div>
      <div id="testBars"></div>
    </div>
  </div>

  <div class="a-card" style="margin-bottom:22px;">
    <div class="section-head"><div><h2>Quick actions</h2><p>Jump to the next step</p></div></div>
    <div class="quick-grid">
      <a class="quick" href="generate.html"><span class="q-ic c-cyan"><i data-icon="sparkles"></i></span><span><b>Generate questions</b><small>Draft from a PDF or a description</small></span></a>
      <a class="quick" href="draft-review.html"><span class="q-ic c-amber"><i data-icon="drafts"></i></span><span><b>Review drafts</b><small>Approve, edit or reject</small></span></a>
      <a class="quick" href="create-test.html"><span class="q-ic c-indigo"><i data-icon="tests"></i></span><span><b>Create a test</b><small>Compose the paper and schedule</small></span></a>
      <a class="quick" href="roster.html"><span class="q-ic c-violet"><i data-icon="roster"></i></span><span><b>Import candidates</b><small>Upload a roster and print slips</small></span></a>
    </div>
  </div>

  <div class="a-card" style="margin-bottom:22px;">
    <div class="section-head">
      <div><h2>Tests</h2><p id="sTestsSub">&nbsp;</p></div>
      <div style="display:flex;gap:8px;"><a href="monitor.html" class="a-btn a-btn-ghost a-btn-sm">Live monitor <i data-icon="arrow-right"></i></a><a href="reports.html" class="a-btn a-btn-ghost a-btn-sm">Reports <i data-icon="arrow-right"></i></a></div>
    </div>
    <div class="a-table-wrap">
      <table class="a-table">
        <thead><tr><th>Next tests</th><th>Starts</th></tr></thead>
        <tbody id="nextBody"><tr><td colspan="2" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="a-grid a-grid-3" style="margin-bottom:22px;">
    <div class="a-card a-stat">
      <span class="kpi-ico i-violet"><i data-icon="fields"></i></span>
      <div class="lbl">Fields &amp; departments configured</div>
      <div class="num" id="sDepts">–</div>
      <div class="delta"><span id="sDeptsSub">&nbsp;</span></div>
    </div>
    <div class="a-card a-stat">
      <span class="kpi-ico i-amber"><i data-icon="book-open"></i></span>
      <div class="lbl">Subjects across all fields</div>
      <div class="num" id="sSubjects">–</div>
      <div class="delta"><span>&nbsp;</span></div>
    </div>
    <div class="a-card a-stat">
      <span class="kpi-ico i-indigo"><i data-icon="tests"></i></span>
      <div class="lbl">General tests</div>
      <div class="num" id="sGeneral">–</div>
      <div class="delta"><span>One test for every candidate</span></div>
    </div>
  </div>

  <div class="a-card">
    <div class="section-head">
      <div><h2>Recently added fields &amp; departments</h2><p>Your latest configuration</p></div>
      <a href="fields-subjects.html" class="a-btn a-btn-ghost a-btn-sm">Manage <i data-icon="arrow-right"></i></a>
    </div>
    <div class="a-table-wrap">
      <table class="a-table">
        <thead><tr><th>Name</th><th>Level</th><th>Subjects</th></tr></thead>
        <tbody id="recentBody"><tr><td colspan="3" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

</template>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/admin-shell.js"></script>
<script>
// Every number on this page is computed by the backend (GET /dashboard/summary) from the database.
const $ = id => document.getElementById(id);
async function loadSummary() {
  try {
    const d = await api('/dashboard/summary');
    $('sDepts').textContent = d.departments.total;
    $('sSubjects').textContent = d.subjects.total;
    $('sGeneral').textContent = d.departments.general_tests;
    const parts = Object.entries(d.departments.by_level).map(([lvl, n]) => `${esc(lvl)} ${n}`);
    $('sDeptsSub').innerHTML = parts.length ? parts.join(' · ') : 'None yet';
    showPhase7(d);
    $('recentBody').innerHTML = d.departments.recent.map(r =>
      `<tr><td class="name">${esc(r.name)}</td><td>${esc(r.level)}</td><td class="mono">${r.subject_count}</td></tr>`).join('')
      || '<tr><td colspan="3" class="muted">Nothing configured yet — <a href="fields-subjects.html">add your first field / department</a>.</td></tr>';
  } catch (e) { $('recentBody').innerHTML = `<tr><td colspan="3" style="color:var(--danger-text);">${esc(e.message)}</td></tr>`; }
}
function showPhase7(d) {
  const t = d.tests, c = d.candidates;
  $('sLive').textContent = t.live;
  $('sLiveSub').textContent = `${c.in_progress} answering · ${c.locked} locked`;
  $('sCands').textContent = c.total;
  $('sCandsSub').textContent = `${c.submitted} submitted`;
  $('sAvg').textContent = d.average_percent === null ? '–' : `${d.average_percent}%`;
  $('sAvgSub').textContent = 'of all submitted attempts';
  $('sQs').textContent = d.questions.approved;
  $('sQsSub').textContent = `${d.questions.waiting_review} waiting for review`;
  drawViz(t, c);
  $('sTestsSub').textContent = `${t.published} published · ${t.draft} draft · ${t.upcoming} upcoming · ${t.ended} ended`;
  $('nextBody').innerHTML = t.next.map(x => `<tr><td class="name">${esc(x.name)}</td>`
    + `<td class="mono">${esc(new Date(x.starts_at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }))}</td></tr>`).join('')
    || '<tr><td colspan="2" class="muted">No upcoming tests — <a href="create-test.html">create one</a>.</td></tr>';
}
// Charts use only numbers the summary endpoint returns. "Not started" is total minus the three counted states.
function drawViz(t, c) {
  const notStarted = Math.max(0, c.total - c.in_progress - c.locked - c.submitted);
  const segs = [
    ['Submitted', c.submitted, 'var(--emerald)'], ['In progress', c.in_progress, 'var(--indigo)'],
    ['Locked', c.locked, 'var(--rose)'], ['Not started', notStarted, 'var(--ov-16)'],
  ];
  $('candBar').innerHTML = c.total
    ? segs.filter(x => x[1]).map(x => `<span style="flex:${x[1]};background:${x[2]};" title="${x[0]}: ${x[1]}"></span>`).join('')
    : '<span class="empty" style="flex:1;"></span>';
  $('candLegend').innerHTML = segs.map(x => `<div><i style="background:${x[2]};"></i>${x[0]}<b>${x[1]}</b></div>`).join('');
  const rows = [['Live now', t.live, 'var(--coral)'], ['Upcoming', t.upcoming, 'var(--indigo)'], ['Draft', t.draft, 'var(--amber)'], ['Ended', t.ended, 'var(--text-3)']];
  const max = Math.max(1, ...rows.map(r => r[1]));
  $('testBars').innerHTML = rows.map(r => `<div class="bar-row"><span class="bl">${r[0]}</span><span class="bt"><span style="width:${r[1] / max * 100}%;background:${r[2]};"></span></span><b>${r[1]}</b></div>`).join('');
}
document.addEventListener('DOMContentLoaded', () => setTimeout(loadSummary, 0));   // after the shell injects the template
</script>
</body>
</html>
