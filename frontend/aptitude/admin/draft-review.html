<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Review — Institution Admin</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="../../assets/css/theme.css" /><link rel="stylesheet" href="../../assets/css/admin-shell.css" />
<link rel="stylesheet" href="../../assets/css/question-bank.css" />
</head>
<body data-page="drafts" data-title="Draft Review" data-sub="Review each generation attempt — only approved questions enter the bank">
<template id="a-actions-template"><a class="a-btn a-btn-amber" href="generate.html">✦ New generation</a></template>
<template id="a-content-template"><div id="view"><div class="a-card a-empty">Loading…</div></div></template>

<div class="a-modal-bg" id="editModal"><div class="a-modal">
  <div class="a-modal-head"><h3>Edit draft question</h3><button class="a-modal-x" onclick="closeModal('editModal')">✕</button></div>
  <div style="display:flex;flex-direction:column;gap:12px;">
    <div class="a-field"><label for="eText">Question</label><textarea class="a-textarea" id="eText"></textarea><div class="field-err" id="err-text"></div></div>
    <div class="a-field" id="eOptsWrap"><label for="eOpts">Options (one per line, 2–6)</label><textarea class="a-textarea" id="eOpts" style="min-height:100px"></textarea><div class="field-err" id="err-options"></div></div>
    <div class="a-grid a-grid-3" style="gap:10px;">
      <div class="a-field"><label for="eAns">Correct option</label><select class="a-select" id="eAns"></select><div class="field-err" id="err-correct_index"></div></div>
      <div class="a-field"><label for="eDiff">Difficulty</label><select class="a-select" id="eDiff"></select></div>
      <div class="a-field"><label for="eMarks">Marks</label><input class="a-input" type="number" id="eMarks" min="1" max="100" /><div class="field-err" id="err-marks"></div></div>
    </div>
    <div class="a-field"><label for="eTopic">Topic (optional)</label><input class="a-input" id="eTopic" maxlength="120" /></div>
    <div class="a-field"><label for="eExpl">Explanation (optional)</label><textarea class="a-textarea" id="eExpl"></textarea><div class="field-err" id="err-explanation"></div></div>
    <button class="btn btn-amber" id="eSave" onclick="saveEdit()">Save changes</button>
  </div></div></div>

<div class="a-modal-bg" id="rejectModal"><div class="a-modal">
  <div class="a-modal-head"><h3>Reject question</h3><button class="a-modal-x" onclick="closeModal('rejectModal')">✕</button></div>
  <div style="display:flex;flex-direction:column;gap:12px;">
    <div class="a-field"><label for="rReason">Reason (optional)</label><textarea class="a-textarea" id="rReason" maxlength="500" placeholder="e.g. Answer is not supported by the PDF"></textarea></div>
    <button class="btn btn-amber" onclick="confirmReject()">Reject question</button>
  </div></div></div>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/admin-shell.js"></script>
<script>
// Phase 3: attempts and questions come from the backend (GET /questions/attempts...). Nothing is kept in localStorage.
let META = null, cur = null, editQ = null, rejectId = null, showHistory = false, busy = false;
const listState = { q: '', status: '', page: 1 };
const $ = id => document.getElementById(id);
const L = (list, v) => { const x = (list || []).find(i => i.value === v); return x ? x.label : v; };
const stBadge = { draft: 'badge-draft', approved: 'badge-approved', rejected: 'badge-rejected', replaced: 'badge-replaced' };
const LETTER = 'ABCDEF';
function fmt(t) { return t ? new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; }
function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }
async function withBusy(fn) {            // stops double clicks while a request is running
  if (busy) { return; }
  busy = true; document.body.style.cursor = 'progress';
  try { await fn(); } catch (e) { handleApiError(e); } finally { busy = false; document.body.style.cursor = ''; }
}

// ---------------- list of attempts
let searchTimer;
function onSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(() => { listState.q = $('sq').value.trim(); listState.page = 1; list(); }, 300); }
async function list() {
  cur = null;
  let d;
  try {
    const qs = new URLSearchParams({ page: listState.page, per_page: 10 });
    if (listState.q) qs.set('q', listState.q);
    if (listState.status) qs.set('status', listState.status);
    d = await api('/questions/attempts?' + qs);
  } catch (e) { return handleApiError(e); }
  const searching = document.activeElement && document.activeElement.id === 'sq';
  $('view').innerHTML = `<div class="filters">
      <input class="a-input" id="sq" placeholder="Search by field, subject or PDF name…" value="${esc(listState.q)}" oninput="onSearch()" />
      <select class="a-select" id="sst" onchange="listState.status=this.value;listState.page=1;list()">
        <option value="">All statuses</option>${['completed', 'partial', 'failed', 'processing'].map(s => `<option value="${s}" ${listState.status === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select></div>
    <div style="display:flex;flex-direction:column;gap:10px;">${d.items.map(a => `
      <div class="a-card qrow attempt-row" onclick="openAttempt(${a.id})">
        <div class="qbody"><p class="qtext"><b>${esc(a.department_name)} → ${esc(a.subject)}</b></p>
          <div class="qmeta"><span class="badge badge-${esc(a.status)}">${esc(a.status)}</span><span class="a-chip">${esc(a.level)}</span>
          <span class="a-chip">${esc(L(META.question_types, a.question_type))} · ${esc(L(META.difficulties, a.difficulty))}</span>
          <span class="a-chip">${sourceChip(a.source)}</span><span class="a-chip">🕒 ${fmt(a.created_at)}</span></div>
          ${a.error ? `<div class="q-reason">${esc(a.error.message)}</div>` : ''}</div>
        <div class="qmeta"><span class="badge badge-draft">${a.counts.draft} draft</span><span class="badge badge-approved">${a.counts.approved} approved</span><span class="badge badge-rejected">${a.counts.rejected} rejected</span></div>
      </div>`).join('') || '<div class="a-card a-empty">No generation attempts yet. Use “New generation” to create one.</div>'}</div>
    ${pager(d)}`;
  if (searching) { const s = $('sq'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}
function sourceChip(src) {
  if (src.kind === 'description') return '✎ Description only';
  const icon = src.ocr ? '📷 ' : '📄 ';
  return icon + esc(src.filename);
}
function pager(d) {
  if (d.pages <= 1) return '';
  return `<div class="pager"><button class="a-btn a-btn-ghost a-btn-sm" ${d.page <= 1 ? 'disabled' : ''} onclick="listState.page--;list()">← Prev</button>
    <span>Page ${d.page} of ${d.pages} · ${d.total} attempts</span>
    <button class="a-btn a-btn-ghost a-btn-sm" ${d.page >= d.pages ? 'disabled' : ''} onclick="listState.page++;list()">Next →</button></div>`;
}

// ---------------- one attempt
async function openAttempt(id) {
  try {
    const { attempt } = await api(`/questions/attempts/${+id}` + (showHistory ? '?include_replaced=1' : ''));
    cur = attempt; history.replaceState(null, '', '?attempt=' + attempt.id); detail();
  } catch (e) {
    if (e.status === 404) { aToast('That attempt was not found.', '⚠'); history.replaceState(null, '', 'draft-review.html'); return list(); }
    handleApiError(e);
  }
}
function back() { history.replaceState(null, '', 'draft-review.html'); list(); }
function optionView(q, o, j) {
  const ok = j === q.correct_index;
  return `<span class="${ok ? 'ok' : ''}">${LETTER[j]}. ${esc(o)}${ok ? ' ✓' : ''}</span>`;
}
function questionActions(q) {
  if (q.status === 'replaced' || q.status === 'approved') return '';
  const editDis = q.status === 'draft' ? '' : 'disabled';
  const regenDis = q.status === 'draft' || q.status === 'rejected' ? '' : 'disabled';
  return `<div class="qactions" style="flex-direction:column;">
      <button class="a-btn a-btn-amber a-btn-sm" onclick="act(${q.id},'approve')" ${editDis}>Approve</button>
      <button class="a-btn a-btn-ghost a-btn-sm" onclick="openEdit(${q.id})" ${editDis}>Edit</button>
      <button class="a-btn a-btn-ghost a-btn-sm" onclick="act(${q.id},'regenerate')" ${regenDis}>Regenerate</button>
      <button class="a-btn a-btn-danger a-btn-sm" onclick="openReject(${q.id})" ${editDis}>Reject</button></div>`;
}
function questionCard(q, i) {
  return `<div class="a-card qrow"><div class="qbody">
    <p class="qtext">${i + 1}. ${esc(q.text)}</p>
    <div class="opt-view">${q.options.map((o, j) => optionView(q, o, j)).join('')}</div>
    ${q.explanation ? `<div class="q-expl">💡 ${esc(q.explanation)}</div>` : ''}
    ${q.rejection_reason ? `<div class="q-reason">Rejected: ${esc(q.rejection_reason)}</div>` : ''}
    <div class="qmeta"><span class="badge ${stBadge[q.status] || ''}">${esc(q.status)}</span>
      <span class="a-chip">${esc(L(META.difficulties, q.difficulty))}</span><span class="a-chip">${q.marks} mark${q.marks > 1 ? 's' : ''}</span>
      ${q.topic ? `<span class="a-chip">${esc(q.topic)}</span>` : ''}${q.is_edited ? '<span class="a-chip">✎ edited</span>' : ''}
      ${q.regenerated_from_id ? '<span class="a-chip">↻ regenerated</span>' : ''}
      ${q.reviewed_by ? `<span class="a-chip">by ${esc(q.reviewed_by)}</span>` : ''}</div></div>
    ${questionActions(q)}
  </div>`;
}
function sourceLines(src) {
  const ai = `${esc(cur.provider || '')} ${esc(cur.model || '')}`;
  if (src.kind === 'description') {
    return `<p class="muted">✎ No PDF — generated from your description · ${ai}</p>
           <p class="muted" style="color:#fbbf24;">These questions come from the AI's general knowledge, not from a document — check every answer carefully.</p>`;
  }
  const files = src.files > 1 ? src.files + ' PDFs: ' : '';
  const pages = src.pages === 1 ? 'page' : 'pages';
  const cut = src.truncated ? ' (very long — only part of it was kept)' : '';
  return `<p class="muted">📄 ${files}${esc(src.filename)} · ${src.pages} ${pages} · ${src.characters.toLocaleString()} characters${cut} · ${ai}</p>`;
}
function detail() {
  const c = cur.counts, src = cur.source;
  const canRegen = c.rejected > 0 || (c.draft + c.approved + c.rejected) < cur.requested_count;
  $('view').innerHTML = `<button class="a-btn a-btn-ghost a-btn-sm" onclick="back()" style="margin-bottom:14px;">← All attempts</button>
  <div class="a-card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
    <div><h2 style="font-size:16px;">${esc(cur.department_name)} → ${esc(cur.subject)} <span class="badge badge-${esc(cur.status)}">${esc(cur.status)}</span></h2>
      <p class="muted">${esc(cur.level)} · ${esc(L(META.question_types, cur.question_type))} · ${esc(L(META.difficulties, cur.difficulty))} · ${fmt(cur.created_at)} · by ${esc(cur.created_by || '—')}</p>
      ${sourceLines(src)}
      ${cur.focus ? `<p class="muted">Instructions: “${esc(cur.focus)}”</p>` : ''}
      ${src.ocr ? '<p class="muted" style="color:#fbbf24;">📷 Some pages were photos / scans — the AI read the text from the pictures first, so check spellings, numbers and formulas extra carefully.</p>' : ''}
      ${cur.error ? `<p class="q-reason">${esc(cur.error.message)}</p>` : ''}
      <p class="muted">AI-generated questions can contain mistakes — check each answer against the PDF before approving.</p></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <span class="badge badge-draft">${c.draft} draft</span><span class="badge badge-approved">${c.approved} approved</span><span class="badge badge-rejected">${c.rejected} rejected</span>
      <button class="a-btn a-btn-ghost a-btn-sm" onclick="regenAttempt()" ${canRegen ? '' : 'disabled'} title="Replace rejected questions / fill up to ${cur.requested_count}">↻ Regenerate rejected</button>
      <button class="a-btn a-btn-amber a-btn-sm" onclick="approveAll()" ${c.draft ? '' : 'disabled'}>Approve all drafts</button></div></div>
  <label class="muted" style="display:flex;gap:6px;align-items:center;margin-bottom:10px;cursor:pointer;">
    <input type="checkbox" ${showHistory ? 'checked' : ''} onchange="showHistory=this.checked;openAttempt(cur.id)" /> Show replaced (history) questions (${c.replaced})</label>
  <div style="display:flex;flex-direction:column;gap:10px;">${cur.questions.map(questionCard).join('') ||
    '<div class="a-card a-empty">No questions in this attempt. Use “Regenerate” to try again with the same PDF.</div>'}</div>`;
}
function act(id, what) {
  return withBusy(async () => {
    if (what === 'regenerate') aToast('Asking the AI for a new question…', '✦');
    await api(`/questions/${+id}/${what}`, { method: 'POST' });
    aToast(what === 'approve' ? 'Approved — added to the Question Bank.' : 'Question regenerated as a new draft.');
    await openAttempt(cur.id);
  });
}
function openReject(id) { rejectId = id; $('rReason').value = ''; openModal('rejectModal'); }
function confirmReject() {
  return withBusy(async () => {
    await api(`/questions/${+rejectId}/reject`, { method: 'POST', body: { reason: $('rReason').value.trim() } });
    closeModal('rejectModal'); aToast('Rejected.', '✕'); await openAttempt(cur.id);
  });
}
function approveAll() {
  return withBusy(async () => {
    const r = await api(`/questions/attempts/${cur.id}/approve-all`, { method: 'POST' });
    cur = r.attempt; detail();
    aToast(r.approved.length + ' approved' + (r.skipped.length ? ` · ${r.skipped.length} need fixing first` : '') + '.');
  });
}
function regenAttempt() {
  return withBusy(async () => {
    aToast('Asking the AI for replacement questions…', '✦');
    const r = await api(`/questions/attempts/${cur.id}/regenerate`, { method: 'POST', body: {} });
    cur = r.attempt; if (showHistory) await openAttempt(cur.id); else detail();
    aToast(`${r.replaced} replaced, ${r.added} added.`);
  });
}

// ---------------- edit
function fillAnswers(opts, sel) { $('eAns').innerHTML = opts.map((o, j) => `<option value="${j}" ${j === sel ? 'selected' : ''}>${LETTER[j] || j + 1}. ${esc(o.slice(0, 60))}</option>`).join(''); }
function openEdit(id) {
  editQ = cur.questions.find(q => q.id === id); if (!editQ) return;
  document.querySelectorAll('.field-err').forEach(e => e.textContent = '');
  $('eText').value = editQ.text; $('eOpts').value = editQ.options.join('\n');
  $('eOptsWrap').hidden = editQ.question_type === 'true_false';
  fillAnswers(editQ.options, editQ.correct_index);
  fillSelect($('eDiff'), META.difficulties); $('eDiff').value = editQ.difficulty;
  $('eMarks').value = editQ.marks; $('eTopic').value = editQ.topic || ''; $('eExpl').value = editQ.explanation || '';
  openModal('editModal');
}
document.addEventListener('input', e => {
  if (e.target.id === 'eOpts') fillAnswers(e.target.value.split('\n').map(x => x.trim()).filter(Boolean), +$('eAns').value || 0);
});
async function saveEdit() {
  document.querySelectorAll('.field-err').forEach(e => e.textContent = '');
  const body = { text: $('eText').value.trim(), correct_index: +$('eAns').value, difficulty: $('eDiff').value,
    marks: +$('eMarks').value, topic: $('eTopic').value.trim(), explanation: $('eExpl').value.trim() };
  if (editQ.question_type !== 'true_false') body.options = $('eOpts').value.split('\n').map(x => x.trim()).filter(Boolean);
  $('eSave').disabled = true;
  try {
    await api(`/questions/${editQ.id}`, { method: 'PUT', body });
    closeModal('editModal'); aToast('Question updated.'); await openAttempt(cur.id);
  } catch (e) {
    if (e.status === 422 && e.details) Object.entries(e.details).forEach(([k, v]) => { const el = $('err-' + k); if (el) el.textContent = v; });
    handleApiError(e);
  } finally { $('eSave').disabled = false; }
}

document.addEventListener('admin:ready', async () => {
  try { META = await loadMeta(); } catch (e) { return handleApiError(e); }
  const id = new URLSearchParams(location.search).get('attempt');
  id ? openAttempt(id) : list();
});
</script></body></html>
