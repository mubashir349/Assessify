<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Question Bank — Institution Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../assets/css/theme.css" />
<link rel="stylesheet" href="../../assets/css/admin-shell.css" />
<link rel="stylesheet" href="../../assets/css/question-bank.css" />
</head>
<body data-page="bank" data-title="Question Bank" data-sub="Field/subject-scoped, structurally parallel to course-mode">

<template id="a-actions-template">
  <button class="a-btn a-btn-amber" onclick="toggleGen()">✦ Generate Questions</button>
</template>

<template id="a-content-template">

  <!-- Generation panel -->
  <div class="a-card gen-panel" id="genPanel" style="margin-bottom:20px;border-color:rgba(245,158,11,.35);">
    <div class="section-head">
      <div><h2>Generate aptitude questions</h2><p>Same AI generation pipeline as course mode — pointed at a Field's subject</p></div>
      <button class="a-btn a-btn-ghost a-btn-sm" onclick="toggleGen()">Close</button>
    </div>
    <div class="a-grid a-grid-3" style="margin-bottom:14px;">
      <div class="a-field"><label>Field</label>
        <select class="a-select"><option>Pre-Engineering</option><option>Pre-Medical</option><option>Computer Science</option><option>Commerce</option></select>
      </div>
      <div class="a-field"><label>Subject</label>
        <select class="a-select"><option>Mathematics</option><option>Chemistry</option><option>Physics</option><option>English (Shared)</option></select>
      </div>
      <div class="a-field"><label>Difficulty</label>
        <select class="a-select"><option>Easy</option><option>Medium</option><option>Hard</option></select>
      </div>
      <div class="a-field"><label>Question type</label>
        <select class="a-select"><option>MCQ</option><option>True/False</option></select>
      </div>
      <div class="a-field"><label>Required count (per candidate)</label><input class="a-input" type="number" value="10" min="1" /></div>
      <div class="a-field"><label>Marks per question</label><input class="a-input" type="number" value="1" min="1" /></div>
    </div>
    <div class="a-field" style="margin-bottom:14px;">
      <label>Optional description / source document</label>
      <textarea class="a-textarea" placeholder="e.g. Focus on algebra and trigonometry, HSC-1 level..."></textarea>
      <span class="hint">Supplying a description or a document improves relevance — structured fields alone also work.</span>
    </div>
    <div class="a-card" style="padding:12px 16px;background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.25);margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--n-300);">
        <span>target_pool = 10 × 1.5 = <b style="color:#fff;">15</b></span>
        <span>generation_count = 15 × 1.3 ≈ <b style="color:#fff;">20 questions to draft</b></span>
      </div>
    </div>
    <button class="btn btn-amber" onclick="toggleGen(); aToast('20 draft questions generated — review below.')">Generate 20 draft questions →</button>
  </div>

  <!-- Sufficiency banner -->
  <div class="a-card" style="margin-bottom:18px;padding:14px 18px;border-color:rgba(245,158,11,.3);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:18px;">⚠</span>
      <div>
        <div style="color:#fff;font-size:13px;font-weight:600;">Pre-Medical → Biology (Hard · MCQ) is short 3 questions</div>
        <div class="muted">7 of 10 required approved. Publishing stays blocked for any test using this combination.</div>
      </div>
    </div>
    <button class="a-btn a-btn-amber a-btn-sm" onclick="aToast('Requested 3 more draft questions for this combination.')">Generate 1 More ×3</button>
  </div>

  <div class="filters">
    <select class="a-select"><option>All Fields</option><option>Pre-Engineering</option><option>Pre-Medical</option><option>Computer Science</option><option>Commerce</option></select>
    <select class="a-select"><option>All Subjects</option><option>Mathematics</option><option>Biology</option><option>English (Shared)</option></select>
    <select class="a-select"><option>All statuses</option><option>Draft</option><option>Approved</option><option>Retired</option></select>
    <input class="a-input" placeholder="Search question text…" />
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">

    <div class="a-card qrow">
      <div class="qbody">
        <p class="qtext">A projectile is launched at 30° above the horizontal with an initial speed of 40 m/s. What is the maximum height reached? (g = 10 m/s²)</p>
        <div class="qmeta">
          <span class="badge badge-draft">Draft</span>
          <span class="a-chip">Pre-Engineering</span><span class="a-chip">Physics</span>
          <span class="a-chip">Hard · MCQ</span><span class="a-chip">2 marks</span>
        </div>
      </div>
      <div class="qactions">
        <button class="a-btn a-btn-ghost a-btn-sm">Edit</button>
        <button class="a-btn a-btn-ghost a-btn-sm">Regenerate</button>
        <button class="a-btn a-btn-amber a-btn-sm" onclick="aToast('Question approved.')">Approve</button>
      </div>
    </div>

    <div class="a-card qrow">
      <div class="qbody">
        <p class="qtext">Which structure in a plant cell is primarily responsible for photosynthesis?</p>
        <div class="qmeta">
          <span class="badge badge-approved">Approved</span>
          <span class="a-chip">Pre-Medical</span><span class="a-chip">Biology</span>
          <span class="a-chip">Easy · MCQ</span><span class="a-chip">1 mark</span>
        </div>
      </div>
      <div class="qactions">
        <button class="a-btn a-btn-ghost a-btn-sm">Edit</button>
        <button class="a-btn a-btn-danger a-btn-sm">Retire</button>
      </div>
    </div>

    <div class="a-card qrow">
      <div class="qbody">
        <p class="qtext">Choose the option that best replaces the underlined phrase: "The committee have decided to postpone the meeting."</p>
        <div class="qmeta">
          <span class="badge badge-approved">Approved</span>
          <span class="a-chip shared">English · Shared</span>
          <span class="a-chip">Medium · MCQ</span><span class="a-chip">1 mark</span>
        </div>
      </div>
      <div class="qactions">
        <button class="a-btn a-btn-ghost a-btn-sm">Edit</button>
        <button class="a-btn a-btn-danger a-btn-sm">Retire</button>
      </div>
    </div>

    <div class="a-card qrow">
      <div class="qbody">
        <p class="qtext" style="text-decoration:line-through;color:var(--n-600);">A binary search tree with n nodes always has a height of log₂(n).</p>
        <div class="qmeta">
          <span class="badge badge-retired">Retired</span>
          <span class="a-chip">Computer Science</span><span class="a-chip">Computer Science</span>
          <span class="a-chip">Medium · True/False</span>
        </div>
      </div>
      <div class="qactions">
        <button class="a-btn a-btn-ghost a-btn-sm">Restore</button>
      </div>
    </div>

  </div>

</template>

<script src="../../assets/js/admin-shell.js"></script>
<script src="../../assets/js/question-bank.js"></script>
</body>
</html>
