<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fields &amp; Subjects — Institution Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../assets/css/theme.css" />
<link rel="stylesheet" href="../../assets/css/admin-shell.css" />
<link rel="stylesheet" href="../../assets/css/fields-subjects.css" />
</head>
<body data-page="fields" data-title="Fields &amp; Subjects" data-sub="Define what this institution tests, and for which programs">

<template id="a-actions-template">
  <button class="a-btn a-btn-amber" onclick="openModal('fieldModal')">+ New Field</button>
  <button class="a-btn a-btn-ghost" onclick="openModal('sharedModal')">+ Shared Subject</button>
</template>

<template id="a-content-template">

  <div class="tabs">
    <div class="tab active" data-tab="fields" onclick="switchTab('fields')">Fields (4)</div>
    <div class="tab" data-tab="shared" onclick="switchTab('shared')">Shared Subjects (1)</div>
  </div>

  <div class="tabpanel active" id="tab-fields">
    <div class="a-grid a-grid-2">

      <div class="a-card field-card">
        <div class="field-card-head">
          <div><h3>Pre-Engineering</h3><p class="muted">4 subjects · 168 approved questions</p></div>
          <button class="a-btn a-btn-ghost a-btn-sm">Edit</button>
        </div>
        <div class="subj-list">
          <span class="a-chip">English <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
          <span class="a-chip">Mathematics <span class="mono" style="color:var(--n-600)">· 48 Q</span></span>
          <span class="a-chip">Chemistry <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
          <span class="a-chip">Physics <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
        </div>
      </div>

      <div class="a-card field-card">
        <div class="field-card-head">
          <div><h3>Pre-Medical</h3><p class="muted">4 subjects · 154 approved questions</p></div>
          <button class="a-btn a-btn-ghost a-btn-sm">Edit</button>
        </div>
        <div class="subj-list">
          <span class="a-chip">English <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
          <span class="a-chip">Biology <span class="mono" style="color:var(--n-600)">· 34 Q</span></span>
          <span class="a-chip">Chemistry <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
          <span class="a-chip">Physics <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
        </div>
      </div>

      <div class="a-card field-card">
        <div class="field-card-head">
          <div><h3>Computer Science</h3><p class="muted">4 subjects · 172 approved questions</p></div>
          <button class="a-btn a-btn-ghost a-btn-sm">Edit</button>
        </div>
        <div class="subj-list">
          <span class="a-chip">English <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
          <span class="a-chip">Mathematics <span class="mono" style="color:var(--n-600)">· 44 Q</span></span>
          <span class="a-chip">Computer Science <span class="mono" style="color:var(--n-600)">· 48 Q</span></span>
          <span class="a-chip">Physics <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
        </div>
      </div>

      <div class="a-card field-card">
        <div class="field-card-head">
          <div><h3>Commerce</h3><p class="muted">3 subjects · 118 approved questions</p></div>
          <button class="a-btn a-btn-ghost a-btn-sm">Edit</button>
        </div>
        <div class="subj-list">
          <span class="a-chip">English <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
          <span class="a-chip">Accounting <span class="mono" style="color:var(--n-600)">· 38 Q</span></span>
          <span class="a-chip">General Math <span class="mono" style="color:var(--n-600)">· 40 Q</span></span>
        </div>
      </div>

    </div>
  </div>

  <div class="tabpanel" id="tab-shared">
    <div class="a-card">
      <div class="section-head">
        <div><h2>English</h2><p>Shared Subject · single pool, generated &amp; approved once</p></div>
        <span class="a-chip shared">160 approved questions</span>
      </div>
      <p class="muted" style="margin-bottom:12px;">Linked Fields — every Field below draws from this one pool:</p>
      <div class="subj-list">
        <span class="a-chip shared">Pre-Engineering <button title="Unlink">✕</button></span>
        <span class="a-chip shared">Pre-Medical <button title="Unlink">✕</button></span>
        <span class="a-chip shared">Computer Science <button title="Unlink">✕</button></span>
        <span class="a-chip shared">Commerce <button title="Unlink">✕</button></span>
      </div>
      <p class="muted" style="margin-top:14px;font-size:11.5px;">
        Sufficiency for this pool is evaluated once, using the largest per-Field requirement among
        Fields drawn on by the same test — not the sum.
      </p>
    </div>
  </div>

</template>

<!-- New Field modal -->
<div class="a-modal-bg" id="fieldModal">
  <div class="a-modal">
    <div class="a-modal-head">
      <div><h3>New Field of study</h3><p class="muted" style="font-size:12px;">e.g. Pre-Engineering, Computer Science</p></div>
      <button class="a-modal-x" onclick="closeModal('fieldModal')">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="a-field"><label>Field name</label><input class="a-input" placeholder="e.g. Pre-Engineering" /></div>
      <div class="a-field">
        <label>Field-specific subjects</label>
        <input class="a-input" placeholder="e.g. Mathematics, Chemistry, Physics (comma-separated)" />
        <span class="hint">Shared Subjects are linked separately below.</span>
      </div>
      <div class="a-field">
        <label>Link Shared Subjects</label>
        <div class="subj-list"><span class="a-chip shared">+ English</span></div>
      </div>
      <button class="btn btn-amber" style="width:100%;" onclick="closeModal('fieldModal'); aToast('Field created — add subjects to its question bank next.')">Create Field</button>
    </div>
  </div>
</div>

<!-- New Shared Subject modal -->
<div class="a-modal-bg" id="sharedModal">
  <div class="a-modal">
    <div class="a-modal-head">
      <div><h3>New Shared Subject</h3><p class="muted" style="font-size:12px;">One pool, linked to any number of Fields</p></div>
      <button class="a-modal-x" onclick="closeModal('sharedModal')">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="a-field"><label>Subject name</label><input class="a-input" placeholder="e.g. English" /></div>
      <div class="a-field">
        <label>Link to Fields</label>
        <div class="subj-list">
          <span class="a-chip">Pre-Engineering</span><span class="a-chip">Pre-Medical</span>
          <span class="a-chip">Computer Science</span><span class="a-chip">Commerce</span>
        </div>
      </div>
      <button class="btn btn-amber" style="width:100%;" onclick="closeModal('sharedModal'); aToast('Shared Subject created.')">Create Shared Subject</button>
    </div>
  </div>
</div>

<script src="../../assets/js/admin-shell.js"></script>
<script src="../../assets/js/fields-subjects.js"></script>
</body>
</html>
