<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports — Institution Admin</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0B1020">
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/icons.js"></script>
<link rel="stylesheet" href="../../assets/css/theme.css" />
<link rel="stylesheet" href="../../assets/css/admin-shell.css" />
<link rel="stylesheet" href="../../assets/css/reports.css" />
</head>
<body data-page="reports" data-title="Reports" data-sub="Results of your published tests, worked out on the server">

<template id="a-content-template">

  <div class="a-card" style="margin-bottom:20px;">
    <div class="section-head"><div><h2>Tests</h2><p>Pick a test to see its report</p></div></div>
    <div class="filters">
      <input class="a-input" id="tQ" aria-label="Search tests" placeholder="Search tests…" style="min-width:220px" />
      <select class="a-select" id="tLevel" aria-label="Filter by level"><option value="">All levels</option></select>
      <select class="a-select" id="tYear" aria-label="Filter by year"><option value="">Any year</option></select>
    </div>
    <div class="a-table-wrap"><table class="a-table">
      <thead><tr><th>Test</th><th>Level</th><th>Date</th><th>State</th><th>Candidates</th><th>Submitted</th><th>Average</th><th></th></tr></thead>
      <tbody id="testsBody"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
    </table></div>
  </div>

  <div id="reportArea" hidden>
    <div class="a-card" style="margin-bottom:20px;">
      <div class="section-head">
        <div><h2 id="rName"></h2><p id="rMeta"></p></div>
        <div class="rep-actions">
          <button type="button" class="a-btn a-btn-primary" id="exportPdfBtn" title="Professional A4 report PDF">Download PDF <i data-icon="download"></i></button>
          <button type="button" class="a-btn a-btn-ghost" id="printPdfBtn" title="Open the A4 report PDF in a new tab for printing">Print PDF <i data-icon="printer"></i></button>
          <button type="button" class="a-btn a-btn-ghost" id="exportBtn" title="Results as a CSV file (opens in Excel, Google Sheets…)">Download CSV <i data-icon="download"></i></button>
          <button type="button" class="a-btn a-btn-ghost" id="exportXlsxBtn" title="Excel workbook: summary, results, by field and by subject">Download Excel <i data-icon="download"></i></button>
          <button type="button" class="a-btn a-btn-primary" id="sendBtn"><i data-icon="mail"></i> Send results</button>
        </div>
      </div>
      <div class="a-grid a-grid-4">
        <div class="a-card a-stat rep-stat"><div class="lbl">Submitted</div><div class="num" id="stSubmitted">–</div><div class="delta" id="stSubmittedSub"></div></div>
        <div class="a-card a-stat rep-stat"><div class="lbl">Average score</div><div class="num" id="stAvg">–</div><div class="delta" id="stMedian"></div></div>
        <div class="a-card a-stat rep-stat"><div class="lbl">Highest score</div><div class="num ok" id="stHigh">–</div></div>
        <div class="a-card a-stat rep-stat"><div class="lbl">Lowest score</div><div class="num bad" id="stLow">–</div></div>
      </div>
    </div>

    <div class="a-grid a-grid-2" style="margin-bottom:20px;">
      <div class="a-card">
        <div class="section-head"><div><h2>Score distribution</h2><p>Submitted candidates per score band</p></div></div>
        <div id="distBars"></div>
        <div class="muted rep-h">Average by field / department</div>
        <div id="deptBars"></div>
      </div>
      <div class="a-card">
        <div class="section-head"><div><h2>Subjects</h2><p>Share of questions answered correctly</p></div></div>
        <div id="subjBars"></div>
        <div class="muted rep-h">Hardest questions</div>
        <div id="hardList"></div>
      </div>
    </div>

    <div class="a-card ai-card" style="margin-bottom:20px;">
      <div class="ai-tag"><i data-icon="sparkles"></i> INSIGHTS · THIS TEST</div>
      <div class="ai-more ai-more-top">
        <div id="ruleTips"></div>
        <div>
          <button type="button" class="a-btn a-btn-ghost a-btn-sm" id="aiBtn"><i data-icon="sparkles"></i> Ask AI for a summary</button>
          <div id="aiTips"></div>
        </div>
      </div>
    </div>

    <div class="a-card">
      <div class="section-head">
        <div><h2>Candidates &amp; result emails</h2><p id="mailNote"></p></div>
        <span class="badge" id="mailBadge"></span>
      </div>
      <div class="filters">
        <input class="a-input" id="cQ" aria-label="Search candidates" placeholder="Search name, roll no. or email…" style="min-width:220px" />
        <select class="a-select" id="cDept" aria-label="Filter by field / department"><option value="">All fields / departments</option></select>
        <select class="a-select" id="cStatus" aria-label="Filter by status">
          <option value="">All candidates</option><option value="submitted">Submitted</option>
          <option value="in_progress">Still taking it</option><option value="not_attempted">Did not attempt</option>
        </select>
        <select class="a-select" id="cEmail" aria-label="Filter by email outcome">
          <option value="">All email outcomes</option><option value="sent">Sent</option><option value="logged">Logged (test mode)</option>
          <option value="failed">Failed</option><option value="not_sent">Not sent yet</option><option value="no_email">No email on roster</option>
        </select>
      </div>
      <div class="a-table-wrap"><table class="a-table">
        <thead><tr><th>Rank</th><th>Candidate</th><th>Roll No.</th><th>Field / Department</th><th>Status</th><th>Score</th><th>Locks</th><th>Result email</th><th>Result PDF</th></tr></thead>
        <tbody id="candBody"></tbody>
      </table></div>
    </div>
  </div>

</template>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/admin-shell.js"></script>
<script src="../../assets/js/ai-insights.js"></script>
<script src="../../assets/js/reports.js"></script>
</body></html>
