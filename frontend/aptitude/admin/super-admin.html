<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Admin — Assessify</title><link rel="icon" href="data:,">
<meta name="theme-color" content="#0B1020">
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/icons.js"></script>
<link rel="stylesheet" href="../../assets/css/theme.css" /><link rel="stylesheet" href="../../assets/css/admin-shell.css" />
</head>
<body data-page="super" data-role="super" data-title="Platform Super Admin" data-sub="Approve institutions and manage platform access">
<template id="a-content-template">
  <div class="a-grid a-grid-3" style="margin-bottom:20px;">
    <div class="a-card a-stat"><div class="lbl">Pending approval</div><div class="num" id="sPend">–</div></div>
    <div class="a-card a-stat"><div class="lbl">Active institutions</div><div class="num" id="sAct">–</div></div>
    <div class="a-card a-stat"><div class="lbl">Total registered</div><div class="num" id="sTot">–</div></div>
  </div>
  <div class="filters">
    <input class="a-input" id="q" aria-label="Search institutions" placeholder="Search institution, campus, city or admin email…" style="min-width:280px" />
    <select class="a-select" id="st" aria-label="Filter by status"><option value="">All statuses</option></select>
  </div>
  <div class="a-card"><div class="a-table-wrap"><table class="a-table">
    <thead><tr><th>Institution</th><th>Type</th><th>Primary admin</th><th>Registered</th><th>Status</th><th></th></tr></thead>
    <tbody id="instBody"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody></table></div></div>
</template>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/admin-shell.js"></script>
<script>
const BADGE = { approved: 'badge-approved', pending: 'badge-draft', rejected: 'badge-rejected', suspended: 'badge-locked' };
const $ = id => document.getElementById(id);
let timer;

async function loadInstitutions() {
  const params = new URLSearchParams();
  if ($('q').value.trim()) params.set('q', $('q').value.trim());
  if ($('st').value) params.set('status', $('st').value);
  try {
    const { items, counts } = await api('/super/institutions' + (params.toString() ? '?' + params : ''));
    $('sPend').textContent = counts.pending; $('sAct').textContent = counts.approved; $('sTot').textContent = counts.total;
    $('instBody').innerHTML = items.map(i => `<tr>
      <td class="name">${esc(i.name)}<div class="muted" style="font-size:11.5px;">${i.campus_name ? esc(i.campus_name) + ' · ' : ''}${esc(i.city)}</div>
        <div class="tags">${i.from_directory ? '<span class="tag tag-ok">From list</span>' : '<span class="tag tag-new">Not in list (typed)</span>'}</div></td>
      <td>${esc(i.type)}</td>
      <td>${i.admin ? `${esc(i.admin.full_name)}<div class="muted" style="font-size:11.5px;">${esc(i.admin.email)}</div>` : '—'}
        <div class="tags"><span class="tag tag-ok"><i data-icon="check"></i> Email verified</span>${emailTags(i)}</div></td>
      <td class="mono">${esc((i.created_at || '').slice(0, 10))}</td>
      <td><span class="badge ${BADGE[i.status]}">${esc(i.status)}</span></td>
      <td style="white-space:nowrap;">${actions(i)}</td></tr>`).join('')
      || '<tr><td colspan="6" class="muted">No institutions found.</td></tr>';
  } catch (e) { $('instBody').innerHTML = `<tr><td colspan="6" style="color:var(--danger-text);">${esc(e.message)}</td></tr>`; }
}

function emailTags(i) {
  if (i.no_official_email) {
    const link = i.has_proof ? ` <button class="a-btn a-btn-ghost a-btn-sm" onclick="downloadProof(${i.id})">View proof</button>` : '';
    return `<span class="tag tag-bad">Free email: check proof</span>${link}`;
  }
  return i.email_domain_verified ? '<span class="tag tag-ok">Domain matches</span>' : '<span class="tag tag-warn">Domain not confirmed</span>';
}

async function downloadProof(id) {
  // the file is behind the login cookie, so fetch it here and hand the browser a local copy to save / open
  try {
    const res = await fetch(API_BASE + '/super/institutions/' + id + '/proof', { credentials: 'include' });
    if (!res.ok) throw new Error((await res.json().catch(() => ({})))?.error?.message || 'Could not load the proof.');
    const name = (res.headers.get('Content-Disposition') || '').match(/filename="?([^";]+)"?/)?.[1] || 'proof';
    const url = URL.createObjectURL(await res.blob());
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { aToast(e.message, 'warn'); }
}

function actions(i) {
  const b = (st, label, cls) => `<button class="a-btn ${cls} a-btn-sm" onclick="setStatus(${i.id},'${st}')">${label}</button> `;
  if (i.status === 'pending') return b('approved', 'Approve', 'a-btn-primary') + b('rejected', 'Reject', 'a-btn-ghost');
  if (i.status === 'approved') return b('suspended', 'Suspend', 'a-btn-danger');
  return b('approved', i.status === 'suspended' ? 'Reactivate' : 'Approve', 'a-btn-primary');
}

async function setStatus(id, status) {
  let note = null;
  if (status === 'rejected' || status === 'suspended') {
    note = prompt(`Reason for ${status === 'rejected' ? 'rejecting' : 'suspending'} (optional):`, '');
    if (note === null) return;               // cancelled
  }
  try { await api('/super/institutions/' + id, { method: 'PATCH', body: { status, note } }); aToast('Institution ' + status + '.'); }
  catch (e) { aToast(e.message, 'warn'); }
  loadInstitutions();
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {   // wait one tick: admin-shell.js injects the template content on DOMContentLoaded
    $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadInstitutions, 300); });
    $('st').addEventListener('change', loadInstitutions);
    loadMeta().then(m => fillSelect($('st'), m.institution_statuses.map(v => ({ value: v, label: v.charAt(0).toUpperCase() + v.slice(1) })), { keepFirst: true })).catch(() => {});
    loadInstitutions();
  }, 0);
});
</script></body></html>
