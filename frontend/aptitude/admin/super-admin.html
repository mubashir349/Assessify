<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Admin — Assessify</title><link rel="icon" href="data:,">
<meta name="theme-color" content="#0B1020">
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/icons.js"></script>
<link rel="stylesheet" href="../../assets/css/theme.css" /><link rel="stylesheet" href="../../assets/css/admin-shell.css" />
</head>
<body data-page="super" data-role="super" data-title="Platform Super Admin" data-sub="Approve institutions and manage platform access">
<template id="a-content-template">
  <div class="a-grid a-grid-3" style="margin-bottom:20px;">
    <div class="a-card a-stat"><div class="lbl">Pending approval</div><div class="num" id="sPend">–</div></div>
    <div class="a-card a-stat"><div class="lbl">Active institutions</div><div class="num" id="sAct">–</div></div>
    <div class="a-card a-stat"><div class="lbl">Total registered</div><div class="num" id="sTot">–</div></div>
  </div>
  <div class="filters">
    <input class="a-input" id="q" aria-label="Search institutions" placeholder="Search institution, campus, city or admin email…" style="min-width:280px" />
    <select class="a-select" id="st" aria-label="Filter by status"><option value="">All statuses</option></select>
  </div>
  <div class="a-card"><div class="a-table-wrap"><table class="a-table">
    <thead><tr><th>Institution</th><th>Type</th><th>Primary admin</th><th>Registered</th><th>Payment</th><th>Status</th><th></th></tr></thead>
    <tbody id="instBody"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody></table></div></div>
</template>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/admin-shell.js"></script>
<script>
const BADGE = { approved: 'badge-approved', pending: 'badge-draft', rejected: 'badge-rejected', suspended: 'badge-locked', awaiting_payment: 'badge-locked' };
const STATUS_LABEL = { awaiting_payment: 'Awaiting payment', pending: 'Paid · awaiting approval', approved: 'Approved', rejected: 'Rejected', suspended: 'Suspended' };
const PAY_LABEL = { created: 'Not completed', paid: 'Paid', failed: 'Failed', cancelled: 'Cancelled', refunded: 'Refunded', refund_failed: 'Refund failed' };
const money = n => 'PKR ' + Number(n).toLocaleString('en-PK', { maximumFractionDigits: 0 });
const $ = id => document.getElementById(id);
let timer;

async function loadInstitutions() {
  const params = new URLSearchParams();
  if ($('q').value.trim()) params.set('q', $('q').value.trim());
  if ($('st').value) params.set('status', $('st').value);
  try {
    const { items, counts } = await api('/super/institutions' + (params.toString() ? '?' + params : ''));
    $('sPend').textContent = counts.pending; $('sAct').textContent = counts.approved; $('sTot').textContent = counts.total;
    $('instBody').innerHTML = items.map(i => `<tr>
      <td class="name">${esc(i.name)}<div class="muted" style="font-size:11.5px;">${i.campus_name ? esc(i.campus_name) + ' · ' : ''}${esc(i.city)}</div>
        <div class="tags">${i.from_directory ? '<span class="tag tag-ok">From list</span>' : '<span class="tag tag-new">Not in list (typed)</span>'}</div></td>
      <td>${esc(i.type)}</td>
      <td>${i.admin ? `${esc(i.admin.full_name)}<div class="muted" style="font-size:11.5px;">${esc(i.admin.email)}</div>` : '—'}
        <div class="tags"><span class="tag tag-ok"><i data-icon="check"></i> Email verified</span>${emailTags(i)}</div></td>
      <td class="mono">${esc((i.created_at || '').slice(0, 10))}</td>
      <td>${paymentCell(i)}</td>
      <td><span class="badge ${BADGE[i.status] || ''}">${esc(STATUS_LABEL[i.status] || i.status)}</span></td>
      <td style="white-space:nowrap;">${actions(i)}</td></tr>`).join('')
      || '<tr><td colspan="7" class="muted">No institutions found.</td></tr>';
    window.INSTS = Object.fromEntries(items.map(i => [i.id, i]));
  } catch (e) { $('instBody').innerHTML = `<tr><td colspan="7" style="color:var(--danger-text);">${esc(e.message)}</td></tr>`; }
}

// Phase 11: the registration payment (Safepay) and, when an automatic refund failed, what to do about it
function paymentCell(i) {
  const p = i.payment;
  if (!p) return `<span class="muted" style="font-size:12px;">${i.status === 'awaiting_payment' ? 'Not paid yet' : 'No payment (registered before payments)'}</span>`;
  const cls = { paid: 'tag-ok', refunded: 'tag-warn', refund_failed: 'tag-bad', failed: 'tag-bad', cancelled: 'tag-warn', created: 'tag-warn' }[p.status] || '';
  let html = `<div>${esc(money(p.amount))} · ${esc(p.plan === 'yearly' ? 'Yearly' : 'Monthly')}</div>
    <div class="tags"><span class="tag ${cls}">${esc(PAY_LABEL[p.status] || p.status)}</span>${p.environment === 'sandbox' ? '<span class="tag tag-new">Test mode</span>' : ''}</div>`;
  if (p.receipt_no) html += `<div class="muted mono" style="font-size:11px;">${esc(p.receipt_no)}</div>`;
  if (i.paid_until) html += `<div class="muted" style="font-size:11px;">Valid until ${esc(i.paid_until.slice(0, 10))}</div>`;
  if (p.status === 'refund_failed') html += `<div style="font-size:11.5px;color:var(--danger-text);margin-top:4px;">${esc(p.refund_error || 'Automatic refund failed.')}</div>
    <button class="a-btn a-btn-primary a-btn-sm" onclick="retryRefund(${i.id})">Retry refund</button>
    <button class="a-btn a-btn-ghost a-btn-sm" onclick="manualRefund(${i.id})" title="Use after refunding it yourself in the Safepay dashboard">Mark refunded by hand</button>`;
  if (p.refund_note) html += `<div class="muted" style="font-size:11px;">${esc(p.refund_note)}</div>`;
  return html;
}

async function retryRefund(id) {
  try { const r = await api(`/super/institutions/${id}/refund/retry`, { method: 'POST', body: {} });
    aToast(r.payment.status === 'refunded' ? 'Refunded. The institution has been emailed.' : esc('Refund failed again: ' + (r.payment.refund_error || '')), r.payment.status === 'refunded' ? '✓' : 'warn'); }
  catch (e) { aToast(esc(e.message), 'warn'); }
  loadInstitutions();
}

async function manualRefund(id) {
  const note = prompt('You refunded this payment yourself in the Safepay dashboard. Add a note (optional, e.g. the refund reference):', '');
  if (note === null) return;
  try { await api(`/super/institutions/${id}/refund/manual`, { method: 'POST', body: { note } }); aToast('Marked as refunded. The institution has been emailed.'); }
  catch (e) { aToast(esc(e.message), 'warn'); }
  loadInstitutions();
}

function emailTags(i) {
  if (i.no_official_email) {
    const link = i.has_proof ? ` <button class="a-btn a-btn-ghost a-btn-sm" onclick="downloadProof(${i.id})">View proof</button>` : '';
    return `<span class="tag tag-bad">Free email: check proof</span>${link}`;
  }
  return i.email_domain_verified ? '<span class="tag tag-ok">Domain matches</span>' : '<span class="tag tag-warn">Domain not confirmed</span>';
}

async function downloadProof(id) {
  // the file is behind the login cookie, so fetch it here and hand the browser a local copy to save / open
  try {
    const res = await fetch(API_BASE + '/super/institutions/' + id + '/proof', { credentials: 'include' });
    if (!res.ok) throw new Error((await res.json().catch(() => ({})))?.error?.message || 'Could not load the proof.');
    const name = (res.headers.get('Content-Disposition') || '').match(/filename="?([^";]+)"?/)?.[1] || 'proof';
    const url = URL.createObjectURL(await res.blob());
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { aToast(e.message, 'warn'); }
}

function actions(i) {
  const b = (st, label, cls) => `<button class="a-btn ${cls} a-btn-sm" onclick="setStatus(${i.id},'${st}')">${label}</button> `;
  if (i.status === 'awaiting_payment') return b('rejected', 'Remove (unpaid)', 'a-btn-ghost');
  if (i.status === 'pending') return b('approved', 'Approve', 'a-btn-primary') + b('rejected', 'Reject', 'a-btn-ghost');
  if (i.status === 'rejected' && i.payment && i.payment.status === 'refunded') return '<span class="muted" style="font-size:11.5px;">Refunded: must pay again</span>';
  if (i.status === 'approved') return b('suspended', 'Suspend', 'a-btn-danger');
  return b('approved', i.status === 'suspended' ? 'Reactivate' : 'Approve', 'a-btn-primary');
}

async function setStatus(id, status) {
  let note = null;
  const inst = (window.INSTS || {})[id], paid = inst?.payment?.status === 'paid';
  if (status === 'rejected' || status === 'suspended') {
    const refund = status === 'rejected' && paid ? `\n\n${money(inst.payment.amount)} will be refunded automatically to their card.` : '';
    note = prompt(`Reason for ${status === 'rejected' ? 'rejecting' : 'suspending'} (optional, it is included in the email):${refund}`, '');
    if (note === null) return;               // cancelled
  }
  try {
    const r = await api('/super/institutions/' + id, { method: 'PATCH', body: { status, note } });
    let msg = status === 'approved' ? 'Approved. The institution has been emailed.' : 'Institution ' + status + '.';
    if (r.refund?.status === 'refunded') msg = `Rejected and ${r.refund.amount} refunded. The institution has been emailed.`;
    if (r.refund?.status === 'refund_failed') msg = `Rejected, but the automatic refund failed: ${r.refund.error || ''} Use “Retry refund” or refund it in the Safepay dashboard.`;
    aToast(esc(msg), r.refund?.status === 'refund_failed' ? 'warn' : '✓');
  }
  catch (e) { aToast(esc(e.message), 'warn'); }
  loadInstitutions();
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {   // wait one tick: admin-shell.js injects the template content on DOMContentLoaded
    $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadInstitutions, 300); });
    $('st').addEventListener('change', loadInstitutions);
    loadMeta().then(m => fillSelect($('st'), m.institution_statuses.map(v => ({ value: v, label: STATUS_LABEL[v] || v })), { keepFirst: true })).catch(() => {});
    loadInstitutions();
  }, 0);
});
</script></body></html>
