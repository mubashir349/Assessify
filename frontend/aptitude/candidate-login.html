<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candidate Login — Aptitude Test</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/css/theme.css" />
<link rel="stylesheet" href="../assets/css/candidate.css" />
<link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body class="mesh-bg">
  <div class="blob-field"></div>
  <a href="../index.html" class="back-link">← Back to AssessAI</a>

  <div class="cand-auth-wrap">
    <form class="cand-auth-card glass fade-up" id="loginForm" novalidate>
      <div class="mark-lg">📝</div>
      <h1>Aptitude Candidate Login</h1>
      <p class="lead">Enter the access code and date of birth printed on the test slip your institution gave you.</p>

      <div class="auth-err" id="authErr"></div>

      <div class="a-field">
        <label for="code">One-time access code</label>
        <input class="a-input" id="code" placeholder="e.g. 8K4Q-2P1X" autocomplete="off" autocapitalize="characters" spellcheck="false" required />
      </div>
      <div class="a-field">
        <label for="dob">Date of birth</label>
        <input class="a-input" id="dob" type="date" required />
      </div>

      <button type="submit" class="btn btn-amber" id="loginBtn" style="width:100%;margin-top:6px;">Continue →</button>

      <p class="cand-attempts">Your access code and date of birth were supplied by your test proctor. Codes are one-time — they become invalid once your attempt is submitted or ended.</p>
    </form>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/candidate-login.js"></script>
</body>
</html>
