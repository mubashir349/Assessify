<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Institution Admin Login — AssessAI Aptitude</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/css/theme.css" />
<link rel="stylesheet" href="../assets/css/admin-shell.css" />
<link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body class="mesh-bg">
  <div class="blob-field"></div>
  <a href="../index.html" class="back-link">← Back to AssessAI</a>

  <div class="auth-wrap">
    <form class="auth-card glass fade-up" id="loginForm" novalidate>
      <div class="auth-brand">
        <div class="mark">Σ</div>
        <div><b>AssessAI</b><span>APTITUDE PORTAL</span></div>
      </div>
      <h1 id="ttl">Welcome back</h1>
      <p class="lead" id="lead">Sign in to manage departments, question banks, rosters, and live aptitude tests.</p>

      <div class="auth-err" id="authErr"></div>
      <div class="auth-ok" id="authOk"></div>

      <div class="a-field">
        <label for="email">Email</label>
        <input class="a-input" type="email" id="email" placeholder="admissions@your-institution.edu" required />
      </div>
      <div class="a-field">
        <label for="password">Password</label>
        <input class="a-input" type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-amber" id="submitBtn" style="width:100%; margin-top:6px;">Sign in →</button>

      <p class="auth-foot" id="foot">New institution? <a href="institution-signup.html">Register here</a><br/>Institutions and the platform Super Admin use this same login.</p>
    </form>
  </div>

  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/institution-login.js"></script>
</body>
</html>
